<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내주(內住) 영성팀 — 에이전트 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a1a;
  --panel: #12122a;
  --border: #2a2a5a;
  --glow-purple: #7c3aed;
  --glow-gold: #f59e0b;
  --glow-blue: #3b82f6;
  --glow-green: #10b981;
  --glow-orange: #f97316;
  --glow-teal: #06b6d4;
  --glow-red: #ef4444;
  --text: #e2e8f0;
  --dim: #64748b;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans KR', sans-serif;
  min-height: 100vh;
  overflow: hidden;
}

/* 배경 별빛 효과 */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    radial-gradient(1px 1px at 20% 30%, rgba(255,255,255,0.3) 0%, transparent 100%),
    radial-gradient(1px 1px at 80% 10%, rgba(255,255,255,0.2) 0%, transparent 100%),
    radial-gradient(1px 1px at 50% 80%, rgba(255,255,255,0.15) 0%, transparent 100%),
    radial-gradient(2px 2px at 10% 60%, rgba(124,58,237,0.2) 0%, transparent 100%),
    radial-gradient(2px 2px at 90% 40%, rgba(59,130,246,0.2) 0%, transparent 100%);
  pointer-events: none;
  z-index: 0;
}

/* 레이아웃 */
.layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  grid-template-rows: 64px 1fr 180px;
  height: 100vh;
  gap: 0;
  position: relative; z-index: 1;
}

/* 헤더 */
.header {
  grid-column: 1/-1;
  background: linear-gradient(90deg, #0a0a1a 0%, #1a1040 50%, #0a0a1a 100%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px;
}
.header-title {
  font-size: 20px; font-weight: 900;
  background: linear-gradient(90deg, #7c3aed, #06b6d4);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}
.header-sub { font-size: 12px; color: var(--dim); letter-spacing: 4px; }
.header-status {
  display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--dim);
}
.pulse-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: #10b981;
  animation: pulse-dot 2s infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:0.5; transform:scale(1.5); }
}

/* 메인 무대 — 원탁 */
.stage {
  position: relative;
  background: radial-gradient(ellipse at center, #1a1040 0%, #0a0a1a 70%);
  border-right: 1px solid var(--border);
  overflow: hidden;
}

/* 원탁 */
.round-table {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 220px; height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, #1e1060 0%, #0f0830 100%);
  border: 2px solid rgba(124,58,237,0.4);
  box-shadow:
    0 0 40px rgba(124,58,237,0.2),
    inset 0 0 40px rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 4px;
}
.table-label {
  font-size: 11px; color: rgba(124,58,237,0.8);
  letter-spacing: 3px; text-transform: uppercase;
}
.table-verse {
  font-size: 10px; color: rgba(255,255,255,0.3);
  text-align: center; padding: 0 20px;
}

/* 에이전트 캐릭터 카드 */
.agent {
  position: absolute;
  width: 110px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  cursor: pointer;
  transition: transform 0.3s;
}
.agent:hover { transform: scale(1.05) !important; }

/* 캐릭터 위치 — 원탁 주변 7자리 */
.agent[data-id="영성"]  { top: 8%;  left: 50%; transform: translateX(-50%); }
.agent[data-id="요한"]  { top: 22%; right: 8%; }
.agent[data-id="베드로"] { top: 52%; right: 4%; }
.agent[data-id="마태"]  { bottom: 10%; right: 18%; }
.agent[data-id="안드레"] { bottom: 10%; left: 18%; }
.agent[data-id="빌립"]  { top: 52%; left: 4%; }
.agent[data-id="도마"]  { top: 22%; left: 8%; }

/* 아바타 원 */
.avatar-wrap {
  position: relative;
  width: 72px; height: 72px;
}
.avatar-ring {
  position: absolute; inset: -4px;
  border-radius: 50%;
  border: 2px solid transparent;
  animation: ring-spin 6s linear infinite;
}
.agent.idle    .avatar-ring { border-color: rgba(255,255,255,0.1); }
.agent.thinking .avatar-ring { border-color: var(--agent-color); border-top-color: transparent; animation-duration: 1s; }
.agent.speaking .avatar-ring { border-color: var(--agent-color); box-shadow: 0 0 12px var(--agent-color); animation-duration: 0.5s; }
.agent.working  .avatar-ring { border-color: var(--agent-color); animation-duration: 0.7s; }

@keyframes ring-spin { to { transform: rotate(360deg); } }

.avatar {
  width: 72px; height: 72px; border-radius: 50%;
  background: var(--agent-bg);
  border: 2px solid var(--agent-color);
  display: flex; align-items: center; justify-content: center;
  font-size: 32px;
  position: relative;
  transition: box-shadow 0.3s, transform 0.3s;
}
.agent.idle     .avatar { animation: bob 3s ease-in-out infinite; }
.agent.thinking .avatar { animation: think-pulse 1s ease-in-out infinite; box-shadow: 0 0 20px var(--agent-color); }
.agent.speaking .avatar { animation: speak-bounce 0.4s ease-in-out infinite alternate; box-shadow: 0 0 30px var(--agent-color); }
.agent.working  .avatar { animation: work-glow 0.8s ease-in-out infinite; }

@keyframes bob          { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
@keyframes think-pulse  { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
@keyframes speak-bounce { from{transform:scale(1)} to{transform:scale(1.06)} }
@keyframes work-glow    { 0%,100%{box-shadow:0 0 10px var(--agent-color)} 50%{box-shadow:0 0 30px var(--agent-color),0 0 60px var(--agent-color)} }

/* 상태 파티클 */
.particles {
  position: absolute; inset: 0;
  border-radius: 50%;
  pointer-events: none;
}
.agent.thinking .particles::before,
.agent.thinking .particles::after {
  content: '💭';
  position: absolute; font-size: 14px;
  animation: float-up 2s ease-out infinite;
}
.agent.thinking .particles::before { top: -10px; left: 10px; animation-delay: 0s; }
.agent.thinking .particles::after  { top: -10px; right: 5px; animation-delay: 1s; }

.agent.working .particles::before {
  content: '⚡';
  position: absolute; font-size: 12px; top: -8px; right: 0;
  animation: float-up 1.5s ease-out infinite;
}

@keyframes float-up {
  0%   { opacity:0; transform:translateY(0) scale(0.5); }
  30%  { opacity:1; transform:translateY(-10px) scale(1); }
  100% { opacity:0; transform:translateY(-30px) scale(0.5); }
}

/* 이름 배지 */
.agent-name {
  font-size: 12px; font-weight: 700;
  color: var(--agent-color);
  text-shadow: 0 0 8px var(--agent-color);
  letter-spacing: 1px;
}
.agent-role {
  font-size: 9px; color: var(--dim);
  text-align: center; line-height: 1.3;
}

/* 상태 배지 */
.status-badge {
  font-size: 9px; padding: 2px 8px; border-radius: 10px;
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--agent-color);
  color: var(--agent-color);
  letter-spacing: 1px;
  transition: all 0.3s;
}
.agent.idle     .status-badge { opacity: 0.4; }
.agent.thinking .status-badge { opacity: 1; animation: badge-pulse 1s infinite; }
.agent.speaking .status-badge { opacity: 1; background: var(--agent-color); color: #000; }
.agent.working  .status-badge { opacity: 1; }
@keyframes badge-pulse { 0%,100%{opacity:0.7} 50%{opacity:1} }

/* 말풍선 */
.speech-bubble {
  display: none;
  position: absolute;
  background: var(--panel);
  border: 1px solid var(--agent-color);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 11px; line-height: 1.6;
  max-width: 200px; min-width: 140px;
  color: var(--text);
  box-shadow: 0 0 20px rgba(0,0,0,0.5), 0 0 8px var(--agent-color);
  z-index: 100;
  animation: bubble-in 0.3s ease-out;
  white-space: pre-wrap;
}
.agent.speaking .speech-bubble { display: block; }

/* 말풍선 방향별 위치 */
.agent[data-id="영성"]  .speech-bubble { top: 90px; left: 50%; transform: translateX(-50%); }
.agent[data-id="요한"]  .speech-bubble { top: 40px; right: 115px; }
.agent[data-id="베드로"] .speech-bubble { top: 0;    right: 115px; }
.agent[data-id="마태"]  .speech-bubble { bottom: 80px; right: 115px; }
.agent[data-id="안드레"] .speech-bubble { bottom: 80px; left: 115px; }
.agent[data-id="빌립"]  .speech-bubble { top: 0;    left: 115px; }
.agent[data-id="도마"]  .speech-bubble { top: 40px; left: 115px; }

@keyframes bubble-in {
  from { opacity:0; transform:scale(0.8) translateX(-50%); }
  to   { opacity:1; transform:scale(1) translateX(-50%); }
}
.agent[data-id="요한"]  .speech-bubble,
.agent[data-id="베드로"] .speech-bubble,
.agent[data-id="마태"]  .speech-bubble,
.agent[data-id="안드레"] .speech-bubble,
.agent[data-id="빌립"]  .speech-bubble,
.agent[data-id="도마"]  .speech-bubble {
  animation: bubble-in-side 0.3s ease-out;
}
@keyframes bubble-in-side {
  from { opacity:0; transform:scale(0.8); }
  to   { opacity:1; transform:scale(1); }
}

/* 사이드 패널 — 로그 */
.log-panel {
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.log-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 11px; font-weight: 700;
  letter-spacing: 3px; color: var(--dim);
  display: flex; align-items: center; gap: 8px;
}
.log-list {
  flex: 1; overflow-y: auto;
  padding: 12px;
  display: flex; flex-direction: column; gap: 8px;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}
.log-item {
  display: flex; gap: 10px; align-items: flex-start;
  animation: log-slide 0.4s ease-out;
}
@keyframes log-slide {
  from { opacity:0; transform:translateX(20px); }
  to   { opacity:1; transform:translateX(0); }
}
.log-icon { font-size: 18px; flex-shrink: 0; margin-top: 2px; }
.log-content {}
.log-agent { font-size: 10px; font-weight: 700; }
.log-text   { font-size: 11px; color: rgba(255,255,255,0.7); line-height: 1.5; margin-top: 2px; }
.log-time   { font-size: 9px; color: var(--dim); margin-top: 2px; }

/* 하단 — 현재 세션 정보 */
.footer {
  grid-column: 1/-1;
  background: var(--panel);
  border-top: 1px solid var(--border);
  display: flex; align-items: flex-start; flex-wrap: wrap; gap: 0;
  overflow: visible; padding-bottom: 8px;
}
.session-info {
  padding: 0 24px;
  display: flex; align-items: center; gap: 24px;
  flex: 1;
}
.session-item { display: flex; flex-direction: column; gap: 2px; }
.session-label { font-size: 9px; color: var(--dim); letter-spacing: 2px; }
.session-value { font-size: 13px; font-weight: 700; }

.progress-bar {
  width: 200px; height: 4px;
  background: rgba(255,255,255,0.1); border-radius: 2px;
  overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 2px;
  background: linear-gradient(90deg, #7c3aed, #06b6d4);
  transition: width 0.5s;
}

/* 입력창 */
.input-area {
  padding: 0 16px;
  border-left: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  width: 360px;
}
.input-box {
  flex: 1; background: rgba(255,255,255,0.05);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 8px 12px; color: var(--text); font-size: 12px;
  font-family: inherit; outline: none;
}
.input-box:focus { border-color: #7c3aed; box-shadow: 0 0 8px rgba(124,58,237,0.3); }
.send-btn {
  background: linear-gradient(135deg, #7c3aed, #06b6d4);
  border: none; border-radius: 8px;
  padding: 8px 16px; color: white;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.send-btn:hover { transform: scale(1.05); box-shadow: 0 0 16px rgba(124,58,237,0.5); }
.send-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* 유튜브 패널 */
.yt-area {
  display: flex; align-items: center; gap: 8px;
  width: 100%; margin-top: 8px;
  background: rgba(255,0,0,0.05);
  border: 1px solid rgba(255,80,80,0.25);
  border-radius: 10px; padding: 8px 12px;
}
.yt-icon { font-size: 18px; color: #ff4444; flex-shrink:0; }
.yt-input {
  flex: 2; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,80,80,0.3); border-radius: 8px;
  padding: 7px 10px; color: var(--text); font-size: 12px;
  font-family: inherit; outline: none;
}
.yt-input:focus { border-color: #ff4444; box-shadow: 0 0 8px rgba(255,68,68,0.3); }
.yt-title {
  flex: 1; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,80,80,0.2); border-radius: 8px;
  padding: 7px 10px; color: var(--text); font-size: 12px;
  font-family: inherit; outline: none;
}
.yt-title:focus { border-color: #ff8888; }
.yt-btn {
  background: linear-gradient(135deg, #ff4444, #f97316);
  border: none; border-radius: 8px;
  padding: 8px 16px; color: white;
  font-size: 12px; font-weight: 700; cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s; flex-shrink:0;
}
.yt-btn:hover { transform: scale(1.05); box-shadow: 0 0 12px rgba(255,68,68,0.5); }
.yt-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; }

/* 에이전트별 색상 */
.agent[data-id="영성"]  { --agent-color:#a855f7; --agent-bg:rgba(168,85,247,0.1); }
.agent[data-id="요한"]  { --agent-color:#f59e0b; --agent-bg:rgba(245,158,11,0.1); }
.agent[data-id="베드로"] { --agent-color:#3b82f6; --agent-bg:rgba(59,130,246,0.1); }
.agent[data-id="마태"]  { --agent-color:#10b981; --agent-bg:rgba(16,185,129,0.1); }
.agent[data-id="안드레"] { --agent-color:#f97316; --agent-bg:rgba(249,115,22,0.1); }
.agent[data-id="빌립"]  { --agent-color:#06b6d4; --agent-bg:rgba(6,182,212,0.1); }
.agent[data-id="도마"]  { --agent-color:#ef4444; --agent-bg:rgba(239,68,68,0.1); }

/* 로그 에이전트별 색상 */
.log-item[data-id="영성"]  .log-agent { color:#a855f7; }
.log-item[data-id="요한"]  .log-agent { color:#f59e0b; }
.log-item[data-id="베드로"] .log-agent { color:#3b82f6; }
.log-item[data-id="마태"]  .log-agent { color:#10b981; }
.log-item[data-id="안드레"] .log-agent { color:#f97316; }
.log-item[data-id="빌립"]  .log-agent { color:#06b6d4; }
.log-item[data-id="도마"]  .log-agent { color:#ef4444; }
</style>
</head>
<body>

<div class="layout">

  <!-- 헤더 -->
  <header class="header">
    <div>
      <div class="header-title">✦ 내주(內住) 영성팀 ✦</div>
      <div class="header-sub">INDWELLING AGENT COUNCIL</div>
    </div>
    <div class="header-status">
      <div class="pulse-dot"></div>
      <span id="global-status">대기 중</span>
    </div>
  </header>

  <!-- 메인 무대 -->
  <main class="stage" id="stage">

    <!-- 원탁 -->
    <div class="round-table">
      <div style="font-size:28px">✦</div>
      <div class="table-label">내주 원탁</div>
      <div class="table-verse">"그리스도께서<br>내 안에 사신다"<br>갈 2:20</div>
    </div>

    <!-- 에이전트 캐릭터들 -->
    <div class="agent idle" data-id="영성">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          🌟
        </div>
      </div>
      <div class="agent-name">영성</div>
      <div class="agent-role">핵심 브레인<br>오케스트레이터</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

    <div class="agent idle" data-id="요한">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          ✝️
        </div>
      </div>
      <div class="agent-name">요한</div>
      <div class="agent-role">사랑의 신학자<br>신학 검증</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

    <div class="agent idle" data-id="베드로">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          ⚓
        </div>
      </div>
      <div class="agent-name">베드로</div>
      <div class="agent-role">공동체의 반석<br>커뮤니티 설계</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

    <div class="agent idle" data-id="마태">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          📖
        </div>
      </div>
      <div class="agent-name">마태</div>
      <div class="agent-role">체계적 기록자<br>교육 설계</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

    <div class="agent idle" data-id="안드레">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          🌉
        </div>
      </div>
      <div class="agent-name">안드레</div>
      <div class="agent-role">연결자·브릿지<br>콘텐츠 확산</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

    <div class="agent idle" data-id="빌립">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          🕊️
        </div>
      </div>
      <div class="agent-name">빌립</div>
      <div class="agent-role">직접 경험 추구자<br>마음챙김 실천</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

    <div class="agent idle" data-id="도마">
      <div class="avatar-wrap">
        <div class="avatar-ring"></div>
        <div class="avatar">
          <div class="particles"></div>
          🔍
        </div>
      </div>
      <div class="agent-name">도마</div>
      <div class="agent-role">의심하는 검증자<br>레드팀</div>
      <div class="status-badge">대기</div>
      <div class="speech-bubble"></div>
    </div>

  </main>

  <!-- 사이드 로그 -->
  <aside class="log-panel">
    <div class="log-header">
      <span>📋</span> 회의록
    </div>
    <div class="log-list" id="log-list"></div>
  </aside>

  <!-- 하단 -->
  <footer class="footer">
    <div class="session-info">
      <div class="session-item">
        <div class="session-label">세션</div>
        <div class="session-value" id="session-name">—</div>
      </div>
      <div class="session-item">
        <div class="session-label">활성 에이전트</div>
        <div class="session-value" id="active-count">0 / 7</div>
      </div>
      <div class="session-item">
        <div class="session-label">진행률</div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress" style="width:0%"></div>
        </div>
      </div>
    </div>
    <div class="input-area">
      <input class="input-box" id="task-input" placeholder="영성팀에게 요청하세요..." />
      <button class="send-btn" id="send-btn">▶ 시작</button>
    </div>
    <!-- 유튜브 추출 패널 -->
    <div class="yt-area">
      <span class="yt-icon">▶</span>
      <input class="yt-input" id="yt-url" placeholder="유튜브 URL 붙여넣기 (예: https://youtu.be/xxxxx)" />
      <input class="yt-title" id="yt-title" placeholder="제목 (선택 — 워맥_은혜_1강)" />
      <button class="yt-btn" id="yt-btn">추출</button>
    </div>
  </footer>

</div>

<script>
// ── 에이전트 상태 관리 ─────────────────────────────────────────────
const AGENTS = {
  '영성':  { emoji:'🌟', role:'오케스트레이터' },
  '요한':  { emoji:'✝️', role:'신학 검증' },
  '베드로':{ emoji:'⚓', role:'커뮤니티' },
  '마태':  { emoji:'📖', role:'교육 설계' },
  '안드레':{ emoji:'🌉', role:'콘텐츠' },
  '빌립':  { emoji:'🕊️', role:'마음챙김' },
  '도마':  { emoji:'🔍', role:'레드팀' },
};

const STATUS_TEXT = {
  idle: '대기',
  thinking: '사고 중',
  working: '작업 중',
  speaking: '발언',
};

function setAgentState(id, state, message = '') {
  const el = document.querySelector(`.agent[data-id="${id}"]`);
  if (!el) return;
  el.className = `agent ${state}`;
  el.querySelector('.status-badge').textContent = STATUS_TEXT[state] || state;
  const bubble = el.querySelector('.speech-bubble');
  bubble.textContent = message;
}

function addLog(agentId, text, emoji) {
  const list = document.getElementById('log-list');
  const time = new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
  const item = document.createElement('div');
  item.className = 'log-item';
  item.dataset.id = agentId;
  item.innerHTML = `
    <div class="log-icon">${emoji || AGENTS[agentId]?.emoji || '💬'}</div>
    <div class="log-content">
      <div class="log-agent">${agentId}</div>
      <div class="log-text">${text}</div>
      <div class="log-time">${time}</div>
    </div>`;
  list.appendChild(item);
  list.scrollTop = list.scrollHeight;
}

function setProgress(pct) {
  document.getElementById('progress').style.width = pct + '%';
}

function setGlobalStatus(text) {
  document.getElementById('global-status').textContent = text;
}

function updateActiveCount() {
  const active = document.querySelectorAll('.agent:not(.idle)').length;
  document.getElementById('active-count').textContent = `${active} / 7`;
}

// ── 데모 시나리오 ──────────────────────────────────────────────────
const DEMO_SCENARIOS = [
  {
    task: '워맥 은혜 신학으로 뉴스레터 1회 작성',
    steps: [
      { delay: 500,  agent:'영성',  state:'speaking',  msg:'좋습니다. 팀을 소집하겠습니다.', log:'요한·마태·안드레에게 임무를 부여합니다.' },
      { delay: 1800, agent:'영성',  state:'working',   msg:'', log:'작업 지시서 작성 중...' },
      { delay: 2500, agent:'요한',  state:'thinking',  msg:'', log:'워맥 은혜 신학의 성경적 근거를 분석합니다.' },
      { delay: 2500, agent:'마태',  state:'thinking',  msg:'', log:'뉴스레터 구조와 교육적 흐름을 설계합니다.' },
      { delay: 2500, agent:'안드레',state:'thinking',  msg:'', log:'독자 공감 포인트와 확산 전략을 기획합니다.' },
      { delay: 4500, agent:'요한',  state:'speaking',  msg:'엡 2:8-9\n"행위에서가 아니요\n은혜로 구원받았으니"', log:'은혜의 신학적 근거 분석 완료 — 갈 2:20, 엡 2:8-9, 롬 5:17 중심.' },
      { delay: 6000, agent:'마태',  state:'speaking',  msg:'훅 → 본문 → 선언문\n→ 실천 과제 구조', log:'뉴스레터 포맷 설계 완료. 화요일 개념편 구조 제안.' },
      { delay: 7500, agent:'안드레',state:'speaking',  msg:'"은혜는 노력이\n아닙니다"', log:'오프닝 훅 초안: "더 열심히 했는데 왜 변하지 않을까요?"' },
      { delay: 9000, agent:'요한',  state:'idle',      msg:'', log:'' },
      { delay: 9000, agent:'마태',  state:'idle',      msg:'', log:'' },
      { delay: 9000, agent:'안드레',state:'idle',      msg:'', log:'' },
      { delay: 9500, agent:'도마',  state:'thinking',  msg:'', log:'초안을 검토합니다. 끌어당김 혼합 위험 점검 중...' },
      { delay: 11000,agent:'도마',  state:'speaking',  msg:'⚠️ 은혜를 도구화\n하는 표현 수정 필요', log:'지적: "원하면 이루어진다" 표현은 번영신학 오해 유발. 수정 권고.' },
      { delay: 12500,agent:'도마',  state:'idle',      msg:'', log:'' },
      { delay: 13000,agent:'영성',  state:'speaking',  msg:'통합 완료!\n뉴스레터 1호 완성', log:'최종 통합 — 도마 지적 반영, 뉴스레터 완성본 저장.' },
      { delay: 15000,agent:'영성',  state:'idle',      msg:'', log:'' },
    ]
  },
  {
    task: '공동체 소그룹 운영 구조 설계',
    steps: [
      { delay: 500,  agent:'영성',  state:'speaking',  msg:'베드로와 빌립\n소집합니다!', log:'공동체 구조 설계 — 베드로·빌립 투입.' },
      { delay: 2000, agent:'베드로',state:'thinking',  msg:'', log:'소그룹 운영 모델과 리더 양성 파이프라인 설계 중...' },
      { delay: 2000, agent:'빌립',  state:'thinking',  msg:'', log:'체험 중심 실습 모듈 기획 중...' },
      { delay: 4000, agent:'베드로',state:'speaking',  msg:'내려놓음 서클\n6~8명, 격주 90분', log:'"내려놓음 서클" 소그룹 모델 제안 — 침묵→렉시오→나눔→중보→기도 구조.' },
      { delay: 5500, agent:'빌립',  state:'speaking',  msg:'호흡 기도 + 임재\n연습 10분씩', log:'각 소그룹 실습 — 호흡 기도, 바디 스캔, 렉시오 디비나 3종 로테이션.' },
      { delay: 7000, agent:'베드로',state:'idle',      msg:'', log:'' },
      { delay: 7000, agent:'빌립',  state:'idle',      msg:'', log:'' },
      { delay: 7500, agent:'영성',  state:'speaking',  msg:'소그룹 구조 완성!', log:'소그룹 운영 매뉴얼 저장 완료.' },
      { delay: 9000, agent:'영성',  state:'idle',      msg:'', log:'' },
    ]
  },
];

// ── 시나리오 실행 ──────────────────────────────────────────────────
let running = false;

async function runScenario(scenario) {
  if (running) return;
  running = true;

  // 초기화
  Object.keys(AGENTS).forEach(id => setAgentState(id, 'idle'));
  document.getElementById('log-list').innerHTML = '';
  document.getElementById('session-name').textContent = scenario.task;
  setProgress(0);
  setGlobalStatus('회의 진행 중...');

  const total = scenario.steps.filter(s => s.state !== 'idle').length;
  let done = 0;

  for (const step of scenario.steps) {
    await new Promise(r => setTimeout(r, step.delay - (scenario.steps[scenario.steps.indexOf(step) - 1]?.delay || 0)));
    setAgentState(step.agent, step.state, step.msg);
    if (step.log) addLog(step.agent, step.log);
    if (step.state !== 'idle') {
      done++;
      setProgress(Math.round(done / total * 100));
    }
    updateActiveCount();
  }

  setGlobalStatus('완료 ✓');
  setProgress(100);
  running = false;
}

// ── 이벤트 ────────────────────────────────────────────────────────
let scenarioIdx = 0;

document.getElementById('send-btn').addEventListener('click', () => {
  const input = document.getElementById('task-input');
  const val = input.value.trim();
  if (val) {
    runScenario({ task: val, steps: DEMO_SCENARIOS[scenarioIdx % DEMO_SCENARIOS.length].steps });
    scenarioIdx++;
    input.value = '';
  } else {
    runScenario(DEMO_SCENARIOS[scenarioIdx % DEMO_SCENARIOS.length]);
    scenarioIdx++;
  }
});

document.getElementById('task-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('send-btn').click();
});

// ── 유튜브 추출 ────────────────────────────────────────────────────
document.getElementById('yt-btn').addEventListener('click', async () => {
  const url   = document.getElementById('yt-url').value.trim();
  const title = document.getElementById('yt-title').value.trim();
  if (!url) { alert('유튜브 URL을 입력하세요.'); return; }

  const btn = document.getElementById('yt-btn');
  btn.disabled = true;
  btn.textContent = '추출 중...';

  setGlobalStatus('유튜브 자막 추출 중...');
  setAgentState('안드레', 'working', '자막 추출 중');
  addLog('안드레', `🎬 유튜브 추출 시작: ${url}`);

  try {
    const res = await fetch('/api/youtube', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, title }),
    });
    const data = await res.json();

    if (data.ok) {
      setAgentState('안드레', 'speaking', '저장 완료!');
      addLog('안드레', `✅ 저장 완료 → ${data.category} / ${data.file}`);
      setGlobalStatus('추출 완료 ✓');
      document.getElementById('yt-url').value = '';
      document.getElementById('yt-title').value = '';
      setTimeout(() => setAgentState('안드레', 'idle'), 3000);
    } else {
      setAgentState('안드레', 'idle');
      addLog('도마', `⚠️ 추출 실패: ${data.error}`);
      setGlobalStatus('추출 실패');
      alert(`오류: ${data.error}`);
    }
  } catch (e) {
    setAgentState('안드레', 'idle');
    addLog('도마', `❌ 서버 오류: ${e.message}`);
    setGlobalStatus('서버 연결 오류');
  }

  btn.disabled = false;
  btn.textContent = '추출';
});

// 유튜브 URL 붙여넣기 자동 감지
document.getElementById('yt-url').addEventListener('paste', (e) => {
  setTimeout(() => {
    const val = document.getElementById('yt-url').value;
    if (val.includes('youtu') && !document.getElementById('yt-title').value) {
      document.getElementById('yt-title').focus();
    }
  }, 100);
});

// 서버 SSE 연결 (서버가 있을 때)
function connectSSE() {
  if (!window.EventSource) return;
  try {
    const es = new EventSource('/events');
    es.onmessage = e => {
      const data = JSON.parse(e.data);
      if (data.type === 'agent_state') {
        setAgentState(data.agent, data.state, data.message || '');
        updateActiveCount();
      } else if (data.type === 'log') {
        addLog(data.agent, data.text);
      } else if (data.type === 'progress') {
        setProgress(data.value);
      } else if (data.type === 'status') {
        setGlobalStatus(data.text);
        document.getElementById('session-name').textContent = data.session || '—';
      }
    };
    es.onerror = () => es.close();
  } catch (e) {}
}
connectSSE();

// 자동 데모 시작
setTimeout(() => {
  document.getElementById('session-name').textContent = '데모 모드';
  addLog('영성', '안녕하세요. 내주 영성팀입니다. 아래 입력창에 요청을 입력하거나 ▶ 버튼을 눌러 데모를 시작하세요.', '🌟');
}, 500);
</script>
</body>
</html>
