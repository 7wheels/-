<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>히어컴퍼니 메일 발송</title>
<style>
:root{
  --bg-base:#0D1117;--bg-card:#161B22;--bg-elv:#21262D;
  --border:#30363D;--border-sub:#21262D;
  --gold-dim:#C8A96E;--gold-mid:#E8C97E;--gold-bright:#E8A020;
  --tp:#E2E8F0;--ts:#C9D1D9;--tm:#8B949E;--tf:#6E7681;
  --green:#3FB950;--red:#F85149;--blue:#58A6FF;--yellow:#E3B341;
  --font:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:var(--font);background:var(--bg-base);color:var(--tp)}
body{display:flex;flex-direction:column}

/* ── Header ── */
.hdr{flex-shrink:0;background:var(--bg-card);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;gap:14px}
.hdr-logo{width:32px;height:32px;background:linear-gradient(135deg,#C8A96E,#F0D080);border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;color:#0D1117;flex-shrink:0}
.hdr-title{font-size:14px;font-weight:800;color:var(--gold-mid)}
.hdr-sub{font-size:10px;color:var(--tf);margin-top:1px}
.back-btn{margin-left:auto;padding:6px 13px;border-radius:6px;border:1px solid var(--border);background:var(--bg-elv);color:var(--tm);font-size:12px;cursor:pointer;text-decoration:none;font-family:var(--font);transition:all .15s}
.back-btn:hover{border-color:var(--gold-dim);color:var(--tp)}

/* ── Main layout ── */
.main{flex:1;display:grid;grid-template-columns:320px 1fr;overflow:hidden}

/* ── Left panel ── */
.panel-l{border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.panel-l-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.panel-l-title{font-size:11px;font-weight:700;color:var(--tf);letter-spacing:.1em}
.toggle-all{font-size:11px;color:var(--gold-dim);cursor:pointer;background:none;border:none;font-family:var(--font);transition:color .15s}
.toggle-all:hover{color:var(--gold-mid)}
.client-list{flex:1;overflow-y:auto;padding:10px}
.client-item{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid var(--border);border-radius:8px;margin-bottom:7px;cursor:pointer;transition:all .15s;user-select:none}
.client-item:hover{border-color:var(--gold-dim);background:rgba(200,169,110,.06)}
.client-item.on{border-color:var(--gold-dim);background:rgba(200,169,110,.1)}
.client-item.disabled{opacity:.4;cursor:not-allowed}
.ci-chk{width:15px;height:15px;accent-color:var(--gold-bright);cursor:pointer;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:700;color:var(--tp)}
.ci-contact{font-size:11px;color:var(--tm);margin-top:1px}
.ci-email{font-size:11px;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ci-no-email{font-size:11px;color:var(--red)}
.mbadge{font-size:10px;padding:1px 6px;border-radius:10px;background:rgba(63,185,80,.15);color:#3FB950;border:1px solid rgba(63,185,80,.35);font-weight:700;flex-shrink:0}
.empty-msg{text-align:center;color:var(--tf);font-size:13px;padding:30px 14px;line-height:1.7}

/* ── Right panel ── */
.panel-r{overflow-y:auto;padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.sec-title{font-size:11px;font-weight:700;color:var(--tf);letter-spacing:.1em;margin-bottom:13px}

/* File drop */
.file-drop{border:2px dashed var(--border);border-radius:8px;padding:22px;text-align:center;cursor:pointer;transition:all .2s;position:relative}
.file-drop:hover,.file-drop.over{border-color:var(--gold-dim);background:rgba(200,169,110,.05)}
.file-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.file-ico{font-size:26px;margin-bottom:7px}
.file-hint{font-size:12px;color:var(--tm);line-height:1.6}
.file-hint b{color:var(--gold-mid)}
.file-info{display:none;align-items:center;gap:10px;padding:10px 13px;background:rgba(63,185,80,.08);border:1px solid rgba(63,185,80,.28);border-radius:7px;margin-top:10px}
.file-info.show{display:flex}
.file-fname{font-size:13px;color:var(--green);font-weight:600;flex:1;word-break:break-all}
.file-rm{background:none;border:none;color:var(--tf);cursor:pointer;font-size:15px;padding:0 3px;line-height:1}
.file-rm:hover{color:var(--red)}

/* Form */
.fg{margin-bottom:13px}
.fg:last-child{margin-bottom:0}
.fl{font-size:12px;font-weight:700;color:var(--tm);margin-bottom:5px;display:block}
.fi,.fta{width:100%;padding:9px 12px;background:var(--bg-elv);border:1.5px solid var(--border);border-radius:7px;color:var(--tp);font-size:13px;outline:none;font-family:var(--font);transition:border-color .15s}
.fi:focus,.fta:focus{border-color:var(--gold-dim)}
.fi::placeholder,.fta::placeholder{color:var(--tf)}
.fta{resize:vertical;min-height:130px;line-height:1.6}

/* Recipients */
.rcpt-wrap{min-height:42px;background:var(--bg-elv);border:1.5px solid var(--border);border-radius:7px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.rtag{display:inline-flex;align-items:center;gap:5px;background:rgba(88,166,255,.12);color:var(--blue);border:1px solid rgba(88,166,255,.25);border-radius:4px;padding:2px 8px;font-size:11px}
.rtag-rm{background:none;border:none;color:rgba(88,166,255,.6);cursor:pointer;font-size:12px;padding:0;line-height:1}
.rtag-rm:hover{color:var(--red)}
.rcpt-empty{font-size:12px;color:var(--tf)}

/* Notice */
.notice{background:rgba(227,179,65,.07);border:1px solid rgba(227,179,65,.22);border-radius:8px;padding:11px 14px;font-size:12px;color:var(--yellow);line-height:1.65}
.notice b{color:var(--gold-mid)}

/* ── Bottom bar ── */
.bot{flex-shrink:0;background:var(--bg-card);border-top:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;gap:10px}
.bot-info{flex:1;font-size:13px;color:var(--tm)}
.bot-info b{color:var(--tp)}
.btn{padding:9px 18px;border-radius:7px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;font-family:var(--font)}
.btn-sec{background:var(--bg-elv);color:var(--ts);border:1px solid var(--border)}
.btn-sec:hover{border-color:var(--gold-dim);color:var(--tp)}
.btn-copy{background:var(--bg-elv);color:var(--blue);border:1px solid rgba(88,166,255,.3)}
.btn-copy:hover{background:rgba(88,166,255,.1)}
.btn-send{background:linear-gradient(135deg,var(--gold-dim),var(--gold-bright));color:#0D1117}
.btn-send:hover{filter:brightness(1.1)}
.btn-send:disabled{opacity:.35;cursor:not-allowed;filter:none}

::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<!-- Header -->
<div class="hdr">
  <div class="hdr-logo">H</div>
  <div>
    <div class="hdr-title">HERECOMPANY</div>
    <div class="hdr-sub">멤버십 메일 발송 시스템</div>
  </div>
  <a href="dashboard.html" class="back-btn">← 대시보드</a>
</div>

<!-- Main -->
<div class="main">

  <!-- Left: 수신자 목록 -->
  <div class="panel-l">
    <div class="panel-l-hdr">
      <span class="panel-l-title">멤버십 고객 <span id="total-lbl"></span></span>
      <button class="toggle-all" id="toggle-all-btn" onclick="toggleAll()">전체 선택</button>
    </div>
    <div class="client-list" id="client-list"></div>
  </div>

  <!-- Right: 메일 작성 -->
  <div class="panel-r">

    <div class="notice">
      <b>📧 발송 방법</b><br>
      ① 수신자 선택 → ② 파일 업로드 → ③ 제목·본문 확인 → ④ <b>메일 발송</b> 클릭<br>
      이메일 클라이언트(Outlook·Gmail 등)가 열리며 수신자·제목·본문이 자동 입력됩니다.<br>
      <b>업로드한 파일을 이메일 클라이언트에서 직접 첨부</b>한 후 발송하세요.
    </div>

    <!-- 파일 업로드 -->
    <div class="card">
      <div class="sec-title">📎 첨부 파일</div>
      <div class="file-drop" id="file-drop">
        <input type="file" id="file-input" onchange="onFile(this)">
        <div class="file-ico">📄</div>
        <div class="file-hint">클릭하거나 파일을 여기로 드래그하세요<br><b>PDF · DOCX · XLSX · HWP</b> 등 모든 형식</div>
      </div>
      <div class="file-info" id="file-info">
        <span style="font-size:20px">📄</span>
        <span class="file-fname" id="file-fname"></span>
        <button class="file-rm" onclick="removeFile()" title="파일 제거">✕</button>
      </div>
    </div>

    <!-- 수신자 -->
    <div class="card">
      <div class="sec-title">👥 수신자</div>
      <div class="rcpt-wrap" id="rcpt-wrap">
        <span class="rcpt-empty">왼쪽에서 고객을 선택하세요</span>
      </div>
    </div>

    <!-- 메일 작성 -->
    <div class="card">
      <div class="sec-title">✉️ 메일 작성</div>
      <div class="fg">
        <label class="fl">제목</label>
        <input class="fi" id="mail-subj" value="[히어컴퍼니] 정부지원사업 리포트 안내">
      </div>
      <div class="fg">
        <label class="fl">본문</label>
        <textarea class="fta" id="mail-body">안녕하세요, 히어컴퍼니입니다.

멤버십 고객사 여러분께 이번 달 정부지원사업 리포트를 전달드립니다.

첨부 파일을 확인하시어 사업 계획에 활용하시기 바랍니다.

감사합니다.
히어컴퍼니 드림</textarea>
      </div>
    </div>

  </div>
</div>

<!-- Bottom bar -->
<div class="bot">
  <div class="bot-info" id="bot-info"><b>0명</b> 선택됨</div>
  <button class="btn btn-copy" onclick="copyEmails()">📋 이메일 주소 복사</button>
  <button class="btn btn-send" id="send-btn" onclick="sendMail()" disabled>📧 메일 발송</button>
</div>

<script>
(function(){
'use strict';

/* ── 데이터 로드 ── */
let clients=[], cases=[], selected=new Set(), fileName=null;

function load(){
  clients=JSON.parse(localStorage.getItem('hc_c')||'[]');
  cases=JSON.parse(localStorage.getItem('hc_k')||'[]');
}

function isMember(cl){
  return cases.some(c=>c.clientId===cl.id&&(c.isMember||c.serviceType==='member'));
}

function memberClients(){return clients.filter(isMember);}

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ── 렌더 ── */
function render(){
  const mem=memberClients();
  const el=document.getElementById('total-lbl');
  el.textContent='('+mem.length+'명)';
  el.style.color='var(--tp)';

  const list=document.getElementById('client-list');
  if(!mem.length){
    list.innerHTML='<div class="empty-msg">멤버십 고객이 없습니다.<br><small>대시보드 → 고객 케이스에서<br>멤버십을 설정해 주세요.</small></div>';
    updateBottom();return;
  }

  list.innerHTML=mem.map(cl=>{
    const on=selected.has(cl.id);
    const hasEmail=!!cl.email;
    return '<div class="client-item'+(on?' on':'')+(hasEmail?'':' disabled')+'" '
      +(hasEmail?'onclick="toggle(\''+cl.id+'\')"':'title="이메일 주소 없음"')+'>'
      +'<input type="checkbox" class="ci-chk"'+(on?' checked':'')+(hasEmail?'':' disabled')
      +' onclick="event.stopPropagation();'+(hasEmail?'toggle(\''+cl.id+'\')':'')+'">'
      +'<div class="ci-info">'
      +'<div class="ci-name">'+esc(cl.companyName)+'</div>'
      +'<div class="ci-contact">'+esc(cl.contactName)+'</div>'
      +(hasEmail
        ?'<div class="ci-email">'+esc(cl.email)+'</div>'
        :'<div class="ci-no-email">⚠ 이메일 없음</div>')
      +'</div>'
      +'<span class="mbadge">멤버</span>'
      +'</div>';
  }).join('');

  renderRcpt();
  updateBottom();
}

function renderRcpt(){
  const mem=memberClients();
  const sel=mem.filter(cl=>selected.has(cl.id)&&cl.email);
  const wrap=document.getElementById('rcpt-wrap');
  if(!sel.length){
    wrap.innerHTML='<span class="rcpt-empty">왼쪽에서 고객을 선택하세요</span>';
    return;
  }
  wrap.innerHTML=sel.map(cl=>
    '<span class="rtag">'+esc(cl.email)
    +'<button class="rtag-rm" onclick="toggle(\''+cl.id+'\')" title="제거">✕</button></span>'
  ).join('');
}

function updateBottom(){
  const mem=memberClients();
  const sel=mem.filter(cl=>selected.has(cl.id)&&cl.email);
  const noEmail=mem.filter(cl=>selected.has(cl.id)&&!cl.email);
  const info=document.getElementById('bot-info');
  const btn=document.getElementById('send-btn');

  let txt='<b>'+sel.length+'명</b> 선택됨';
  if(noEmail.length) txt+=' <span style="color:var(--yellow);font-size:12px">(이메일 없는 '+noEmail.length+'명 제외)</span>';
  info.innerHTML=txt;
  btn.disabled=!sel.length;
}

/* ── 토글 ── */
window.toggle=function(id){
  if(selected.has(id))selected.delete(id);else selected.add(id);
  render();
};

window.toggleAll=function(){
  const mem=memberClients().filter(cl=>cl.email);
  const allOn=mem.every(cl=>selected.has(cl.id));
  if(allOn){mem.forEach(cl=>selected.delete(cl.id));}
  else{mem.forEach(cl=>selected.add(cl.id));}
  document.getElementById('toggle-all-btn').textContent=allOn?'전체 선택':'전체 해제';
  render();
};

/* ── 파일 ── */
window.onFile=function(inp){
  if(!inp.files.length)return;
  fileName=inp.files[0].name;
  document.getElementById('file-fname').textContent=fileName;
  document.getElementById('file-info').classList.add('show');
};

window.removeFile=function(){
  fileName=null;
  document.getElementById('file-input').value='';
  document.getElementById('file-info').classList.remove('show');
};

/* drag & drop */
const drop=document.getElementById('file-drop');
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('over');});
drop.addEventListener('dragleave',()=>drop.classList.remove('over'));
drop.addEventListener('drop',e=>{
  e.preventDefault();drop.classList.remove('over');
  const f=e.dataTransfer.files[0];
  if(!f)return;
  fileName=f.name;
  document.getElementById('file-fname').textContent=fileName;
  document.getElementById('file-info').classList.add('show');
});

/* ── 이메일 주소 복사 ── */
window.copyEmails=function(){
  const mem=memberClients();
  const emails=mem.filter(cl=>selected.has(cl.id)&&cl.email).map(cl=>cl.email);
  if(!emails.length){alert('선택된 이메일이 없습니다.');return;}
  navigator.clipboard.writeText(emails.join('; ')).then(()=>{
    const btn=document.querySelector('.btn-copy');
    const orig=btn.textContent;
    btn.textContent='✅ 복사 완료!';
    btn.style.color='var(--green)';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},2200);
  }).catch(()=>{
    prompt('아래 주소를 복사하세요 (Ctrl+C):',emails.join('; '));
  });
};

/* ── 메일 발송 ── */
window.sendMail=function(){
  const mem=memberClients();
  const sel=mem.filter(cl=>selected.has(cl.id)&&cl.email);
  if(!sel.length)return;

  const subj=document.getElementById('mail-subj').value;
  const rawBody=document.getElementById('mail-body').value
    +(fileName?'\n\n[첨부파일명: '+fileName+']':'');

  const emails=sel.map(cl=>cl.email);
  const encSubj=encodeURIComponent(subj);
  const encBody=encodeURIComponent(rawBody);

  /* 수신자 수가 많으면 BCC 사용 */
  let mailto;
  if(emails.length===1){
    mailto='mailto:'+encodeURIComponent(emails[0])+'?subject='+encSubj+'&body='+encBody;
  } else {
    /* TO: 첫 번째, BCC: 나머지 → 개인정보 보호 */
    mailto='mailto:'+encodeURIComponent(emails[0])
      +'?bcc='+encodeURIComponent(emails.slice(1).join(','))
      +'&subject='+encSubj+'&body='+encBody;
  }

  /* URL 길이 초과 시 분할 발송 안내 */
  if(mailto.length>4000){
    const chunk=10;
    const parts=[];
    for(let i=0;i<emails.length;i+=chunk)parts.push(emails.slice(i,i+chunk));
    const msg='수신자가 많아 '+parts.length+'번으로 나눠 발송합니다.\n확인을 누를 때마다 이메일 클라이언트가 열립니다.';
    if(!confirm(msg))return;
    parts.forEach((batch,i)=>{
      setTimeout(()=>{
        const m='mailto:'+encodeURIComponent(batch[0])
          +(batch.length>1?'?bcc='+encodeURIComponent(batch.slice(1).join(','))+'&':'?')
          +'subject='+encSubj+'&body='+encBody;
        window.open(m,'_self');
      },i*800);
    });
    return;
  }

  window.location.href=mailto;
};

/* ── 초기화 ── */
load();
render();
})();
</script>
</body>
</html>
